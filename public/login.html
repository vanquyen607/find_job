<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đăng nhập FindJob để tìm kiếm, lưu và so sánh việc làm từ 5 nền tảng.">
  <title>FindJob - Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-page">
    <aside class="auth-brand" aria-hidden="true">
      <a href="/" class="back-home" tabindex="-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
        Về trang chủ
      </a>

      <div class="brand-content">
        <div class="brand-logo">💼</div>
        <h1 class="brand-title">Find<span>Job</span></h1>
        <p class="brand-subtitle">Tìm kiếm việc làm thông minh từ 5 nền tảng lớn</p>

        <div class="brand-features">
          <div class="brand-feature">
            <div class="brand-feature-icon">⚡</div>
            <span>Dữ liệu việc làm cập nhật real-time</span>
          </div>
          <div class="brand-feature">
            <div class="brand-feature-icon">🎯</div>
            <span>Lọc thông minh theo yêu cầu</span>
          </div>
          <div class="brand-feature">
            <div class="brand-feature-icon">📊</div>
            <span>So sánh và lưu việc yêu thích</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="auth-form-panel">
      <a href="/" class="back-home back-home-mobile">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
        Về trang chủ
      </a>
      <div class="auth-form-container">
        <div class="auth-form-header">
          <h1>Đăng nhập</h1>
          <p>Chào mừng bạn trở lại!</p>
        </div>

        <form class="auth-form" id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="email@example.com"
              autocomplete="email" maxlength="254" required>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="password-field">
              <input type="password" id="password" name="password" placeholder="Nhập mật khẩu"
                autocomplete="current-password" minlength="8" maxlength="128" required>
              <button type="button" class="toggle-password" data-toggle-password="password" aria-pressed="false">Hiện</button>
            </div>
          </div>

          <div class="form-error" id="error-message" role="alert" hidden></div>

          <button type="submit" class="btn-submit" id="submit-btn">
            <span class="spinner" id="submit-spinner" hidden aria-hidden="true"></span>
            <span id="submit-label">Đăng nhập</span>
          </button>
        </form>

        <p class="auth-switch">
          Chưa có tài khoản? <a href="/register.html">Đăng ký ngay</a>
        </p>
      </div>
    </main>
  </div>

  <script src="auth.js" defer></script>
</body>
</html>
