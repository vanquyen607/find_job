app = 'find-job-app'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[http_service.concurrency]
  type = 'requests'
  hard_limit = 100
  soft_limit = 80

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # Chromium scrapers need headroom; 256MB OOM-kills the browser.
  memory_mb = 1024
